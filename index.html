<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà 20/10 Siêu Cute Của  DI tặng bạn nò </title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng gấu bông, hoa và trái tim rơi */
        .falling-element {
            position: fixed;
            font-size: 24px;
            animation: floatUp 5s linear infinite;
            bottom: -40px;
            z-index: 1;
            opacity: 0.85;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Khung chính giao diện Cute */
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #ff7675;
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(255, 118, 117, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .cute-decor {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1.main-title {
            color: #d63031;
            margin-bottom: 12px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p.subtitle {
            color: #636e72;
            margin-bottom: 25px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        select, button {
            width: 100%;
            padding: 15px 18px;
            border-radius: 15px;
            border: 2px solid #ff7675;
            font-size: 1.1rem;
            margin-bottom: 18px;
            outline: none;
        }

        select {
            background-color: #fffdf9;
            color: #2d3436;
            cursor: pointer;
        }

        button.btn-receive {
            background: linear-gradient(45deg, #ff7675, #e84393);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(232, 67, 147, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.btn-receive:hover {
            transform: translateY(-3deg) scale(1.02);
            box-shadow: 0 8px 25px rgba(232, 67, 147, 0.5);
        }

        /* Khung chứa Mã QR Trang Trí Cute */
        #qrSection {
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        .qr-card-box {
            background: #fff0f3;
            border: 3px dashed #ff7675;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            position: relative;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 10px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* Khung Hiển Thị Bức Thư */
        .envelope-view {
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .letter-paper {
            background: #fffdf9;
            border: 3px dashed #e17055;
            padding: 30px;
            border-radius: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3436;
            text-align: left;
            line-height: 1.8;
            margin: 20px 0;
            font-size: 1.15rem;
            white-space: pre-line;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(255, 118, 117, 0.08);
        }

        .btn-back {
            background: #636e72;
            border: none;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

        // Đưa danh sách tên vào Dropdown
        const selectElem = document.getElementById('nameSelect');
        Object.keys(letterDatabase).forEach(name => {

            option.value = name;
            option.textContent = name;
            selectElem.appendChild(option);
        });

        let currentSelectedName = "";

        // Hàm tạo mã QR Cute

            const selectedName = selectElem.value;
            if (!selectedName) {
                alert("Vui lòng chọn hoặc nhập tên của bạn nhé!");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const targetUrl = `${baseUrl}?name=${encodeURIComponent(selectedName)}`;

            qrContainer.innerHTML = "";

                text: targetUrl,
                width: 170,
                height: 170,
                colorDark : "#d63031",
                colorLight : "#ffffff"
            });
