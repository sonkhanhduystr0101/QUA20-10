<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="not-loaded">

    <!-- MÀN HÌNH 1: NHẬP TÊN (HIỆN ĐẦU TIÊN) -->
    <div id="name-screen" class="name-screen">
        <div class="name-box">
            <h2>Gửi tặng người đặc biệt 🌸</h2>
            <p>Nhập tên của bạn để mở món quà nhé:</p>
            <input type="text" id="recipient-name" placeholder="VD: Mai, Lan, Phương..." autocomplete="off">
            <button id="start-btn">Mở Quà 💌</button>
        </div>
    </div>

    <!-- MÀN HÌNH 2: NỀN TỐI & HOA ANH ĐÀO GỐC -->
    <div class="night"></div>
    <div class="happy-woman-day">𝓗𝓪𝓹𝓹𝔂 𝔀𝓸𝓶𝓮𝓷'𝓼 𝓭𝓪𝔂 2️⃣0️⃣/1️⃣0️⃣</div>
    
    <!-- LÁ THƯ TƯƠNG TÁC -->
    <div id="letter-container" class="letter-container hidden">
        <div class="letter-card" id="letter-card">
            <div class="letter-front">
                <h3 id="letter-title">Gửi cậu ❤️</h3>
                <p>Nhấn vào đây để mở thư nhé 💌</p>
            </div>
            <div class="letter-back">
                <h3>Lời Chúc 20/10</h3>
                <p id="letter-content">Chúc bạn luôn xinh đẹp và hạnh phúc!</p>
            </div>
        </div>
    </div>

    <div class="flowers">
      <div class="flower flower--1">
        <div class="flower__leafs flower__leafs--1">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
  
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
  
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
          <div class="flower__line__leaf flower__line__leaf--5"></div>
          <div class="flower__line__leaf flower__line__leaf--6"></div>
        </div>
      </div>
  
      <div class="flower flower--2">
        <div class="flower__leafs flower__leafs--2">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
  
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
  
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>
  
      <div class="flower flower--3">
        <div class="flower__leafs flower__leafs--3">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__white-circle"></div>
  
          <div class="flower__light flower__light--1"></div>
          <div class="flower__light flower__light--2"></div>
          <div class="flower__light flower__light--3"></div>
          <div class="flower__light flower__light--4"></div>
          <div class="flower__light flower__light--5"></div>
          <div class="flower__light flower__light--6"></div>
          <div class="flower__light flower__light--7"></div>
          <div class="flower__light flower__light--8"></div>
  
        </div>
        <div class="flower__line">
          <div class="flower__line__leaf flower__line__leaf--1"></div>
          <div class="flower__line__leaf flower__line__leaf--2"></div>
          <div class="flower__line__leaf flower__line__leaf--3"></div>
          <div class="flower__line__leaf flower__line__leaf--4"></div>
        </div>
      </div>
  
      <div class="grow-ans" style="--d:1.2s">
        <div class="flower__g-long">
          <div class="flower__g-long__top"></div>
          <div class="flower__g-long__bottom"></div>
        </div>
      </div>
  
      <div class="growing-grass">
        <div class="flower__grass flower__grass--1">
          <div class="flower__grass--top"></div>
          <div class="flower__grass--bottom"></div>
          <div class="flower__grass__leaf flower__grass__leaf--1"></div>
          <div class="flower__grass__leaf flower__grass__leaf--2"></div>
          <div class="flower__grass__leaf flower__grass__leaf--3"></div>
          <div class="flower__grass__leaf flower__grass__leaf--4"></div>
          <div class="flower__grass__leaf flower__grass__leaf--5"></div>
          <div class="flower__grass__leaf flower__grass__leaf--6"></div>
          <div class="flower__grass__leaf flower__grass__leaf--7"></div>
          <div class="flower__grass__leaf flower__grass__leaf--8"></div>
          <div class="flower__grass__overlay"></div>
        </div>
      </div>
  
      <div class="growing-grass">
        <div class="flower__grass flower__grass--2">
          <div class="flower__grass--top"></div>
          <div class="flower__grass--bottom"></div>
          <div class="flower__grass__leaf flower__grass__leaf--1"></div>
          <div class="flower__grass__leaf flower__grass__leaf--2"></div>
          <div class="flower__grass__leaf flower__grass__leaf--3"></div>
          <div class="flower__grass__leaf flower__grass__leaf--4"></div>
          <div class="flower__grass__leaf flower__grass__leaf--5"></div>
          <div class="flower__grass__leaf flower__grass__leaf--6"></div>
          <div class="flower__grass__leaf flower__grass__leaf--7"></div>
          <div class="flower__grass__leaf flower__grass__leaf--8"></div>
          <div class="flower__grass__overlay"></div>
        </div>
      </div>
    </div>

    <script>
      const startBtn = document.getElementById('start-btn');
      const nameScreen = document.getElementById('name-screen');
      const recipientInput = document.getElementById('recipient-name');
      const letterContainer = document.getElementById('letter-container');
      const letterCard = document.getElementById('letter-card');
      const letterTitle = document.getElementById('letter-title');
      const letterContent = document.getElementById('letter-content');

      startBtn.addEventListener('click', () => {
        const name = recipientInput.value.trim();
        if (!name) {
          alert('Vui lòng nhập tên của bạn nhé!');
          return;
        }

        // Ẩn màn hình nhập tên, chạy hiệu ứng cây hoa
        nameScreen.style.opacity = '0';
        setTimeout(() => {
          nameScreen.style.display = 'none';
          document.body.classList.remove("not-loaded");
        }, 500);

        // Tùy chỉnh lời chúc theo tên
        if (name.toLowerCase() === 'mai') {
          letterTitle.innerText = `Gửi Mai đi ha ❤️`;
          letterContent.innerText = `Chúc Mai ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp, rạng rỡ và luôn giữ nụ cười tươi trên môi nhé! ✨`;
        } else {
          letterTitle.innerText = `Gửi ${name} ❤️`;
          letterContent.innerText = `Chúc ${name} có một ngày 20/10 ngập tràn hạnh phúc, luôn tươi cười và thành công trên con đường mình chọn! 🌸`;
        }

        // Hiện lá thư sau khi cây nở xong (3 giây)
        setTimeout(() => {
          letterContainer.classList.remove('hidden');
        }, 3000);
      });

      // Nhấn vào thư để lật ra lời chúc
      letterCard.addEventListener('click', () => {
        letterCard.classList.toggle('open');
      });
    </script>
</body>
</html>
