<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà 20/10 Bất Ngờ - Sơn Khánh Duy</title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng gấu bông, hoa và trái tim rơi */
        .falling-element {
            position: fixed;
            font-size: 24px;
            animation: floatUp 5s linear infinite;
            bottom: -40px;
            z-index: 1;
            opacity: 0.85;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Khung chính giao diện Cute */
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #ff7675;
            border-radius: 25px;
            padding: 35px 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(255, 118, 117, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .cute-decor {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1.main-title {
            color: #d63031;
            margin-bottom: 12px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p.subtitle {
            color: #636e72;
            margin-bottom: 25px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        input[type="text"], button {
            width: 100%;
            padding: 15px 18px;
            border-radius: 15px;
            border: 2px solid #ff7675;
            font-size: 1.1rem;
            margin-bottom: 18px;
            outline: none;
        }

        input[type="text"] {
            background-color: #fffdf9;
            color: #2d3436;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #d63031;
            box-shadow: 0 0 10px rgba(214, 48, 49, 0.2);
        }

        button.btn-receive {
            background: linear-gradient(45deg, #ff7675, #e84393);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(232, 67, 147, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.btn-receive:hover {
            transform: translateY(-3deg) scale(1.02);
            box-shadow: 0 8px 25px rgba(232, 67, 147, 0.5);
        }

        /* Khung chứa Mã QR Trang Trí Cute */
        #qrSection {
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        .qr-card-box {
            background: #fff0f3;
            border: 3px dashed #ff7675;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            position: relative;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 10px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: inline-block;
        }

        /* Khung Hiển Thị Bức Thư */
        .envelope-view {
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .letter-paper {
            background: #fffdf9;
            border: 3px dashed #e17055;
            padding: 30px;
            border-radius: 18px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3436;
            text-align: left;
            line-height: 1.8;
            margin: 20px 0;
            font-size: 1.15rem;
            white-space: pre-line;
            max-height: 480px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(255, 118, 117, 0.08);
        }

        .btn-back {
            background: #636e72;
            border: none;
            color: white;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- GIAO DIỆN CHÍNH: CUTE 20/10 -->
    <div class="card-container" id="mainCard">
        <div class="cute-decor">🧸 🌸 🎀 🌺 🧸</div>
        <h1 class="main-title">✨ CHÚC MỪNG 20/10 ✨</h1>
        <p class="subtitle">Hãy nhập họ và tên của bạn để nhận phần quà bí mật nhé!</p>
        
        <!-- Ô TỰ NHẬP TÊN -->
        <input type="text" id="nameInput" placeholder="Nhập tên của bạn ở đây..." autocomplete="off">

        <button class="btn-receive" onclick="generateCuteQR()">Nhận Mã QR Thư 🎁</button>

        <!-- KHU VỰC HIỆN MÃ QR SAU KHỊ NHẬP TÊN -->
        <div id="qrSection">
            <div class="qr-card-box">
                <div style="font-size: 1.8rem; margin-bottom: 5px;">🧸 💖 💌</div>
                <h2 style="color: #d63031;" id="qrTitle">Mã QR Lá Thư Bí Mật</h2>
                <p style="font-size: 0.95rem; color: #636e72; margin-top: 5px;">
                    Dùng điện thoại quét mã QR cute này để mở thư nhé!
                </p>
                
                <div id="qrcode"></div>

                <button class="btn-receive" style="margin-top: 10px;" onclick="openLetterDirectly()">
                    Đọc Thư Trực Tiếp 📖
                </button>
            </div>
        </div>
    </div>

    <!-- KHU VỰC HIỂN THỊ BỨC THƯ -->
    <div class="card-container envelope-view" id="letterCard">
        <div style="font-size: 2rem;">💌 🌸 🧸</div>
        <h1 id="letterHeader" style="color: #d63031; margin-top: 10px;">Gửi...</h1>
        <div class="letter-paper" id="letterText"></div>
        <button class="btn-back" onclick="goBack()">Quay lại trang chính 🔄</button>
    </div>

    <script>
        // Danh sách các lá thư ứng với từng tên
        const letterDatabase = {
            "Phạm Thị Ngọc Mai": {
                title: "Chúc mừng 20/10 Ngọc Mai! 🌸",
                text: "Chào Ngọc Mai,\n\nDạo này việc học đại học sao rồi Mai, lịch học với thi cử bớt dồn dập chưa? Bữa giờ lu bu quá tính ra tụi mình từ hồi tốt nghiệp cấp ba tới giờ cũng lâu lắm rồi chưa có dịp ngồi lại mần ly cà phê tám chuyện.\n\nNhân ngày 20/10, Duy chúc Mai lúc nào cũng tươi tắn, học hành qua môn dễ dàng, điểm số cao chót vót và săn được nhiều học bổng nha. Dù đứa nào cũng bận rộn với môi trường mới nhưng Duy lúc nào cũng nhớ tới tình bạn thời cấp ba của tụi mình. Hôm nào rảnh rỗi thu xếp được thì nhắn Duy cái, tụi mình đi cà phê gầy sòng nói chuyện tiếp.\n\nChúc Mai có một ngày 20/10 thiệt là vui vẻ!\nSơn Khánh Duy"
            },
            "Trịnh Thị Bảo Ngọc": {
                title: "Happy 20/10 chị Bảo Ngọc! 💖",
                text: "Em chào chị Bảo Ngọc,\n\nLâu quá không gặp, dạo này chị khỏe hông? Đi làm đợt này công việc bớt lu bu chưa hay vẫn chạy deadline muốn xỉu vậy chị?\n\nNhân dịp 20/10, em chúc chị Ngọc ngày càng trẻ trung, xinh đẹp, công việc phơi phới, lương thưởng ngon lành và tiền vô tài khoản ào ào nha. Chúc cho mấy dự định sắp tới trong công việc của chị cái nào cũng thành công rực rỡ. Hôm nay chị nhớ tự thưởng cho mình bữa ăn thiệt ngon hoặc đi chill thư giãn nhé. Cuối tuần nào rảnh rỗi chị em mình gầy kèo gặp nhau một chuyến.\n\nSơn Khánh Duy"
            },
            "La Đặng Thảo My": {
                title: "Chúc Thảo My 20/10 thiệt nhiều niềm vui! 🌷",
                text: "Chào Thảo My,\n\nNgoảnh đi ngoảnh lại mà lâu lắm rồi không gặp lại My. Dạo này đi làm công việc thế nào rồi, có bị tăng ca nhiều hông? Hôm nay tới 20/10 nên Duy nhắn tin hỏi thăm coi dạo này sống sao rồi.\n\nChúc Thảo My ngày 20/10 thiệt là nhiều niềm vui, công việc suôn sẻ, sếp thương đồng nghiệp quý và gặp toàn may mắn. Mong My luôn vững vàng, sự nghiệp thăng tiến và mần ăn trúng lớn nha. Dù bận rộn tới đâu cũng nhớ giữ gìn sức khỏe. Khi nào thong thả nhắn Duy, tụi mình lại đi cà phê như hồi trước.\n\nSơn Khánh Duy"
            },
            "Thạch Như Lý": {
                title: "Happy Women's Day 20/10 Như Lý! 🌺",
                text: "Chào Như Lý,\n\nDạo này việc học trên trường đại học với mấy kế hoạch mới tới đâu rồi Lý? Tuy dạo này ít gặp nhưng Duy vẫn thỉnh thoảng thấy Lý đăng hình đi học, chạy bài tập bận rộn suốt.\n\nNgày 20/10, Duy chúc Như Lý lúc nào cũng năng động, tươi rói, học hành ngon lành và gặt hái được nhiều thành tích tốt trên trường. Chúc cho mấy mục tiêu Lý đang theo đuổi sớm thu về kết quả ngon lành như mong đợi. Hy vọng sớm có dịp tụ tập lại để ngồi trò chuyện nhiều hơn. Tận hưởng một ngày 20/10 thiệt trọn vẹn nha!\n\nSơn Khánh Duy"
            }
        };

        // Lời chúc mặc định cho những tên chưa có trong danh sách
        const defaultLetter = (name) => ({
            title: `Chúc mừng 20/10 ${name}! 🌸`,
            text: `Chào ${name},\n\nNhân ngày Phụ nữ Việt Nam 20/10, chúc ${name} luôn xinh đẹp, rạng rỡ, gặp nhiều may mắn và luôn hạnh phúc trong cuộc sống nha!\n\nSơn Khánh Duy`
        });

        let currentInputName = "";

        // Hàm tạo Mã QR khi nhập tên
        function generateCuteQR() {
            const nameInput = document.getElementById('nameInput').value.trim();
            if (!nameInput) {
                alert("Vui lòng nhập tên của bạn vào ô trống nhé!");
                return;
            }

            currentInputName = nameInput;
            const baseUrl = window.location.href.split('?')[0];
            const targetUrl = `${baseUrl}?name=${encodeURIComponent(nameInput)}`;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ""; 

            new QRCode(qrContainer, {
                text: targetUrl,
                width: 170,
                height: 170,
                colorDark : "#d63031",
                colorLight : "#ffffff"
            });

            document.getElementById('qrTitle').innerText = `Mã QR Dành Cho ${nameInput}`;
            document.getElementById('qrSection').style.display = 'block';
        }

        // Mở thư trực tiếp
        function openLetterDirectly() {
            if (currentInputName) {
                showLetter(currentInputName);
            }
        }

        // Hiện nội dung thư
        function showLetter(name) {
            // Tìm thư theo tên, nếu không có sẽ lấy mẫu mặc định
            const data = letterDatabase[name] || defaultLetter(name);

            document.getElementById('letterHeader').innerText = data.title;
            document.getElementById('letterText').innerText = data.text;

            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('letterCard').style.display = 'block';
        }

        // Tự động đọc tham số tên từ URL khi người khác quét mã QR
        const urlParams = new URLSearchParams(window.location.search);
        const nameParam = urlParams.get('name');
        if (nameParam) {
            showLetter(nameParam);
        }

        // Quay lại trang chính
        function goBack() {
            window.location.href = window.location.href.split('?')[0];
        }

        // Hiệu ứng bong bóng / hoa rơi ngẫu nhiên
        const icons = ['🧸', '🌸', '💖', '🌺', '✨', '🌷', '🎀'];
        function createFalling() {
            const el = document.createElement('div');
            el.classList.add('falling-element');
            el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = Math.random() * 2 + 3.5 + 's';
            document.body.appendChild(el);

            setTimeout(() => { el.remove(); }, 5000);
        }
        setInterval(createFalling, 300);
    </script>
</body>
</html>
