<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Women's Day 20/10</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="main.js" defer></script>
</head>
<body>

    <div class="night"></div>
    <div class="happy-woman-day">𝓗𝓪𝓹𝓹𝔂 𝔀𝓸𝓶𝓮𝓷'𝓼 𝓭𝓪𝔂 2️⃣0️⃣/1️⃣0️⃣</div>

    <!-- KHUNG NHẬP TÊN BAN ĐẦU -->
    <div class="card-container">
        <div class="cute-decor">🧸 🌸 💖 🌺</div>
        <h1 class="main-title">✨ CHÚC MỪNG 20/10 ✨</h1>
        <p class="subtitle">Nhập chính xác tên của ní để nhận phần quà bí mật từ Duy nhé!</p>

        <div class="input-group">
            <input type="text" id="userNameInput" placeholder="Nhập tên của ní vào đây nè..." autocomplete="off">
            <button class="btn-submit" type="button" onclick="checkNameAndOpen()">Nhận Quà Phụ Nữ Việt Nam 🎁</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- MODAL PHONG BÌ & THIỆP HOA ANH ĐÀO VÀ HỘP QUÀ -->
    <div class="modal-overlay" id="letterModal">
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="toggleEnvelope()">

            <div class="dove dove-1">🕊️</div>
            <div class="dove dove-2">🕊️</div>

            <div class="envelope">
                <div class="envelope-flap">
                    <div class="seal-heart">💖</div>
                </div>

                <div class="letter-paper" id="letterContentContainer">
                    <button class="btn-close-modal" type="button" onclick="closeLetterModal(event)">✕</button>

                    <div class="bear-top">🧸</div>

                    <!-- SVG VIỀN HOA ANH ĐÀO VÀ HỘP QUÀ -->
                    <div class="letter-sakura-border">
                        <svg viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Cụm Hoa Anh Đào Góc Trên Trái -->
                            <g transform="translate(15, 15) scale(0.9)">
                                <path d="M0 0 Q 30 20, 60 10 Q 80 5, 100 25" stroke="#8d5b4c" stroke-width="3" fill="none"/>
                                <g transform="translate(30, 15)">
                                    <path d="M12 3 C8-2 3 1 5 7 C0 5-3 12 4 15 C-2 20 5 25 10 20 C13 27 21 23 18 17 C25 19 28 11 21 8 C25 2 18-2 12 3Z" fill="#ffb7c5"/>
                                    <circle cx="11" cy="10" r="3" fill="#ffffff"/>
                                    <circle cx="11" cy="10" r="1.5" fill="#e84393"/>
                                </g>
                                <g transform="translate(70, 8) scale(0.75)">
                                    <path d="M12 3 C8-2 3 1 5 7 C0 5-3 12 4 15 C-2 20 5 25 10 20 C13 27 21 23 18 17 C25 19 28 11 21 8 C25 2 18-2 12 3Z" fill="#ff78a8"/>
                                    <circle cx="11" cy="10" r="3" fill="#ffffff"/>
                                </g>
                            </g>

                            <!-- Cụm Hộp Quà & Hoa Anh Đào Góc Dưới Phải -->
                            <g transform="translate(290, 380)">
                                <g transform="translate(20, 30)">
                                    <rect x="0" y="20" width="55" height="45" rx="5" fill="#ff7675"/>
                                    <rect x="-4" y="10" width="63" height="14" rx="3" fill="#d63031"/>
                                    <rect x="22" y="20" width="11" height="45" fill="#feca57"/>
                                    <rect x="22" y="10" width="11" height="14" fill="#ff9f43"/>
                                    <path d="M15 0 C5 -10 0 10 24 10 C48 10 43 -10 33 0 C28 -5 20 -5 15 0Z" fill="#feca57"/>
                                </g>
                                <g transform="translate(-10, -10)">
                                    <path d="M50 50 Q 20 30, 0 45" stroke="#8d5b4c" stroke-width="2.5" fill="none"/>
                                    <g transform="translate(10, 25) scale(0.85)">
                                        <path d="M12 3 C8-2 3 1 5 7 C0 5-3 12 4 15 C-2 20 5 25 10 20 C13 27 21 23 18 17 C25 19 28 11 21 8 C25 2 18-2 12 3Z" fill="#ff78a8"/>
                                        <circle cx="11" cy="10" r="3" fill="#ffffff"/>
                                    </g>
                                    <g transform="translate(-15, 35) scale(0.65)">
                                        <path d="M12 3 C8-2 3 1 5 7 C0 5-3 12 4 15 C-2 20 5 25 10 20 C13 27 21 23 18 17 C25 19 28 11 21 8 C25 2 18-2 12 3Z" fill="#ffb7c5"/>
                                        <circle cx="11" cy="10" r="3" fill="#ffffff"/>
                                    </g>
                                </g>
                            </g>
                        </svg>
                    </div>

                    <!-- Nội dung lời chúc -->
                    <div id="letterContentText"></div>
                </div>

                <div class="envelope-front"></div>
            </div>

            <div class="click-hint">👇 Chạm vào phong bì để mở lá thư nha!</div>
        </div>
    </div>

</body>
</html>
