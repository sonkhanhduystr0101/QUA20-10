        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng gấu bông, hoa và trái tim rơi */
        .falling-element {
            position: fixed;
            font-size: 24px;
            animation: floatUp 5s linear infinite;
            bottom: -40px;
            z-index: 1;
            opacity: 0.85;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

            max-width: 650px;
            width: 100%;

            position: relative;
            z-index: 10;
