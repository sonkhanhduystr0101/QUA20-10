<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà 20/10 Bất Ngờ - Sơn Khánh Duy</title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng hoa/trái tim rơi */
        .falling-element {
            position: fixed;
            font-size: 22px;
            animation: floatUp 4.5s linear infinite;
            bottom: -30px;
            z-index: 1;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            max-width: 680px; /* Tăng kích thước khung thiệp */
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        h1 {
            color: #d63031;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: #636e72;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        select, input, button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #dfe6e9;
            font-size: 1.05rem;
            margin-bottom: 15px;
            outline: none;
        }

        select {
            background-color: #fff;
            color: #2d3436;
            cursor: pointer;
        }

        button {
            background: linear-gradient(45deg, #ff7675, #d63031);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2deg);
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        /* Khung chứa mã QR */
        #qrDisplay {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: #fff0f3;
            border-radius: 15px;
            border: 1px solid #ffccd5;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        /* Giao diện lá thư mở rộng */
        .envelope-view {
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .letter-paper {
            background: #fffdf9;
            border: 2px dashed #e17055;
            padding: 30px;
            border-radius: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2d3436;
            text-align: left;
            line-height: 1.8;
            margin: 20px 0;
            font-size: 1.1rem; /* Tăng cỡ chữ lá thư */
            white-space: pre-line;
            max-height: 480px; /* Tăng chiều cao tối đa lá thư */
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
        }

        .btn-back {
            background: #636e72;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Khung nhập / chọn tên -->
    <div class="card-container" id="selectionCard">
        <h1>🌸 Lời Chúc 20/10 🌸</h1>
        <p class="subtitle">Vui lòng chọn hoặc nhập tên của bạn để tạo mã QR thư!</p>
        
        <select id="nameSelect">
            <option value="">-- Chọn tên của bạn từ danh sách --</option>
        </select>

        <button onclick="generateQR()">Tạo Mã QR Thư 💌</button>

        <!-- Khu vực hiển thị mã QR sau khi tạo -->
        <div id="qrDisplay">
            <h3 style="color: #d63031;" id="qrTitle">Mã QR Lá Thư</h3>
            <p style="font-size: 0.9rem; color: #636e72; margin-top: 5px;">Quét mã QR bằng điện thoại hoặc bấm nút bên dưới để đọc thư</p>
            <div id="qrcode"></div>
            <button onclick="openLetterDirectly()">Mở Thư Ngay Bây Giờ 💖</button>
        </div>
    </div>

    <!-- Khung hiển thị nội dung thư (Đã bỏ avatar, tăng kích thước) -->
    <div class="card-container envelope-view" id="letterCard">
        <h1 id="letterHeader">Gửi...</h1>
        <div class="letter-paper" id="letterText"></div>
        <button class="btn-back" onclick="goBack()">Quay lại
