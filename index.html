<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Món Quà 20/10 Siêu Cute Của Duy tặng nì</title>
    <!-- Thư viện QRCode và hiệu ứng tung hoa (Canvas Confetti) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 1. Nền Gradient Chuyển Động Rực Rỡ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #a1c4fd, #c2e9fb, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. Hiệu ứng Icon Bay & Xoay Đa Dạng */
        .falling-element {
            position: fixed;
            font-size: 26px;
            animation: floatAndRotate 6s linear infinite;
            bottom: -50px;
            z-index: 1;
            opacity: 0.9;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
        }

        @keyframes floatAndRotate {
            0% { 
                transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); 
                opacity: 1; 
            }
            50% { 
                transform: translateY(-50vh) translateX(30px) rotate(180deg) scale(1.2); 
            }
            100% { 
                transform: translateY(-105vh) translateX(-20px) rotate(360deg) scale(0.8); 
                opacity: 0; 
            }
        }

        /* 3. Hiệu ứng Bong Bóng Nổi mờ ảo */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 8s infinite ease-in;
            z-index: 1;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        /* 4. Khung Card Phát Sáng & Nhịp Đập nhẹ */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border: 4px solid #ff7675;
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 118, 117, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(255, 118, 117, 0.4); }
            100% { box-shadow: 0 0 40px rgba(214, 48, 49, 0.7); }
        }

        .cute-decor {
            font-size: 2.3rem;
            margin-bottom: 8px;
            letter-spacing: 6px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1.main-title {
            color: #d63031;
            margin-bottom: 8px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.8);
        }

        p.subtitle {
            color: #636e72;
            margin-bottom: 22px;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 2px solid #ff7675;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            background-color: #fff5f5;
            color: #2d3436;
        }

        input[type="text"]:focus {
            border-color: #d63031;
            box-shadow: 0 0 15px rgba(214, 48, 49, 0.4);
            background-color: #ffffff;
            transform: scale(1.02);
        }

        button.btn-submit {
            background: linear-gradient(135deg, #ff7675, #d63031);
            color: white;
            border: none;
            padding: 16px 25px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4);
            width: 100%;
        }

        button.btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(214, 48, 49, 0.6);
        }

        button.btn-submit:active {
            transform: scale(0.97);
        }

        .error-message {
            color: #d63031;
            font-weight: bold;
            margin-top: 12px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        #qr-result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #ff7675;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 18px 0;
            cursor: pointer;
            transition: transform 0.3s;
        }

        #qrcode:hover {
            transform: scale(1.05);
        }

        #qrcode img {
            border: 6px solid #fff;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
            max-width: 220px;
        }

        .qr-hint {
            color: #00b894;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .btn-scan-sim {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4);
            transition: all 0.3s;
        }

        .btn-scan-sim:hover {
            transform: translateY(-2px);
        }

        /* 5. Nội dung Lá Thư hiển thị khi Quét Mã */
        .preview-text {
            display: none;
            background: #ffffff;
            border: 2px solid #ffeaa7;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            font-size: 0.98rem;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-line;
            max-height: 260px;
            overflow-y: auto;
            margin-top: 20px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06), 0 8px 20px rgba(0,0,0,0.08);
            animation: openLetter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes openLetter {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="cute-decor">🧸 🌸 💖 🌺</div>
        <h1 class="main-title">✨ CHÚC MỪNG 20/10 ✨</h1>
        <p class="subtitle">Nhập chính xác tên của ní để nhận phần quà bí mật từ Duy nhé!</p>

        <div class="input-group">
            <input type="text" id="userNameInput" placeholder="Nhập tên của ní vào đây nè..." autocomplete="off">
            <button class="btn-submit" onclick="generateQR()">Nhận Quà Phụ Nữ Việt Nam 🎁</button>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="qr-result">
            <div class="qr-hint">📲 Quét mã QR này (hoặc ấn vào) để mở thư nhé!</div>
            <div id="qrcode" onclick="revealLetter()"></div>
            
            <button class="btn-scan-sim" onclick="revealLetter()">📩 Bấm Vào Đây Để Mở Lá Thư</button>
            
            <div class="preview-text" id="textPreview"></div>
        </div>
    </div>

    <script>
        // 1. Tạo hiệu ứng Icon bay lung linh
        const icons = ['🧸', '🌸', '💖', '🌺', '🎀', '✨', '🌷', '💐', '🎁'];
        function createFallingElements() {
            setInterval(() => {
                const element = document.createElement('div');
                element.classList.add('falling-element');
                element.innerText = icons[Math.floor(Math.random() * icons.length)];
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDuration = (Math.random() * 3 + 4) + 's';
                element.style.fontSize = (Math.random() * 12 + 20) + 'px';
                document.body.appendChild(element);

                setTimeout(() => { element.remove(); }, 7000);
            }, 300);
        }

        // 2. Tạo hiệu ứng Bong bóng nổi
        function createBubbles() {
            for (let i = 0; i < 12; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 40 + 20 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = (Math.random() * 5 + 6) + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(bubble);
            }
        }

        createFallingElements();
        createBubbles();

        // 3. Nội dung lời chúc riêng
        const messagesData = {
            "mai": `Chào Phạm Thị Ngọc Mai,

Dạo này việc học đại học sao rồi Mai, lịch học với thi cử bớt dồn dập chưa? Bữa giờ lu bu quá tính ra tụi mình từ hồi tốt nghiệp cấp ba tới giờ cũng lâu lắm rồi chưa có dịp ngồi lại mần ly cà phê tám chuyện.

Nhân ngày 20/10, Sơn Khánh Duy chúc Mai lúc nào cũng tươi tắn, học hành qua môn dễ dàng, điểm số cao chót vót và săn được nhiều học bổng nha. Dù đứa nào cũng bận rộn với môi trường mới nhưng Duy lúc nào cũng nhớ tới tình bạn thời cấp ba của tụi mình. Hôm nào rảnh rỗi thu xếp được thì nhắn Duy cái, tụi mình đi cà phê gầy sòng nói chuyện tiếp.

Chúc Mai có một ngày 20/10 thiệt là vui vẻ!

Sơn Khánh Duy`,

            "ngoc": `Em chào chị Trịnh Thị Bảo Ngọc,

Lâu quá không gặp, dạo này chị khỏe hông? Đi làm đợt này công việc bớt lu bu chưa hay vẫn chạy deadline muốn xỉu vậy chị?

Nhân dịp 20/10, em chúc chị Ngọc ngày càng trẻ trung, xinh đẹp, công việc phơi phới, lương thưởng ngon lành và tiền vô tài khoản ào ào nha. Chúc cho mấy dự định sắp tới trong công việc của chị cái nào cũng thành công rực rỡ. Hôm nay chị nhớ tự thưởng cho mình bữa ăn thiệt ngon hoặc đi chill thư giãn nhé. Cuối tuần nào rảnh rỗi chị em mình gầy kèo gặp nhau một chuyến.

Sơn Khánh Duy`,

            "my": `Chào La Đặng Thảo My,

Ngoảnh đi ngoảnh lại mà lâu lắm rồi không gặp lại My. Dạo này đi làm công việc thế nào rồi, có bị tăng ca nhiều hông? Hôm nay tới 20/10 nên Duy nhắn tin hỏi thăm coi dạo này sống sao rồi.

Chúc Thảo My ngày 20/10 thiệt là nhiều niềm vui, công việc suôn sẻ, sếp thương đồng nghiệp quý và gặp toàn may mắn. Mong My luôn vững vàng, sự nghiệp thăng tiến và mần ăn trúng lớn nha. Dù bận rộn tới đâu cũng nhớ giữ gìn sức khỏe. Khi nào thong thả nhắn Duy, tụi mình lại đi cà phê như hồi trước.

Sơn Khánh Duy`,

            "ly": `Chào Thạch Như Lý,

Dạo này việc học trên trường đại học với mấy kế hoạch mới tới đâu rồi Lý? Tuy dạo này ít gặp nhưng Duy vẫn thỉnh thoảng thấy Lý đăng hình đi học, chạy bài tập bận rộn suốt.

Ngày 20/10, Duy chúc Như Lý lúc nào cũng năng động, tươi rói, học hành ngon lành và gặt hái được nhiều thành tích tốt trên trường. Chúc cho mấy mục tiêu Lý đang theo đuổi sớm thu về kết quả ngon lành như mong đợi. Hy vọng sớm có dịp tụ tập lại để ngồi trò chuyện nhiều hơn. Tận hưởng một ngày 20/10 thiệt trọn vẹn nha!

Sơn Khánh Duy`
        };

        let currentMessage = "";

        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            return str.toLowerCase().trim();
        }

        function generateQR() {
            try {
                const inputVal = document.getElementById('userNameInput').value;
                const cleanInput = removeVietnameseTones(inputVal);
                const errorDiv = document.getElementById('errorMessage');
                const resultDiv = document.getElementById('qr-result');
                const qrContainer = document.getElementById('qrcode');
                const textPreview = document.getElementById('textPreview');

                errorDiv.style.display = 'none';
                resultDiv.style.display = 'none';
                textPreview.style.display = 'none';
                qrContainer.innerHTML = '';

                if (!cleanInput) {
                    errorDiv.innerText = "⚠️ Ní ơi, nhập tên vào ô trước rồi mới ấn nhận quà được nha!";
                    errorDiv.style.display = 'block';
                    return;
                }

                let foundKey = null;
                if (cleanInput.includes("mai")) foundKey = "mai";
                else if (cleanInput.includes("ngoc")) foundKey = "ngoc";
                else if (cleanInput.includes("my")) foundKey = "my";
                else if (cleanInput.includes("ly")) foundKey = "ly";

                if (foundKey) {
                    currentMessage = messagesData[foundKey];

                    if (typeof QRCode !== 'undefined') {
                        new QRCode(qrContainer, {
                            text: currentMessage,
                            width: 200,
                            height: 200,
                            colorDark: "#d63031",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } else {
                        const googleQrUrl = `https://chart.googleapis.com/chart?cht=qr&chs=220x220&chl=${encodeURIComponent(currentMessage)}`;
                        qrContainer.innerHTML = `<img src="${googleQrUrl}" alt="Mã QR 20/10">`;
                    }

                    textPreview.innerText = currentMessage;
                    resultDiv.style.display = 'block';
                } else {
                    errorDiv.innerText = "⚠️ Tên này hông có trong danh sách nhận quà của Duy rồi! Ní kiểm tra lại xem gõ đúng tên chưa nha.";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                alert("Có lỗi xảy ra, vui lòng thử lại nhé!");
            }
        }

        // 4. Mở thư kèm hiệu ứng pháo hoa hoa hồng (Confetti)
        function revealLetter() {
            const textPreview = document.getElementById('textPreview');
            textPreview.style.display = 'block';
            textPreview.scrollIntoView({ behavior: 'smooth' });

            // Bắn pháo hoa hoa hồng mừng 20/10
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff7675', '#d63031', '#fecfef', '#ffffff']
                });
            }
        }

        document.getElementById('userNameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                generateQR();
            }
        });
    </script>
</body>
</html>
