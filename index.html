<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Món Quà 20/10 Siêu Cute Của Duy tặng nì</title>
    <!-- Thư viện pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff758c, #ff7eb3, #a1c4fd, #c2e9fb, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Icon bay & Bong bóng */
        .falling-element {
            position: fixed;
            font-size: 26px;
            animation: floatAndRotate 6s linear infinite;
            bottom: -50px;
            z-index: 1;
            opacity: 0.9;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
        }

        @keyframes floatAndRotate {
            0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 1; }
            50% { transform: translateY(-50vh) translateX(30px) rotate(180deg) scale(1.2); }
            100% { transform: translateY(-105vh) translateX(-20px) rotate(360deg) scale(0.8); opacity: 0; }
        }

        .bubble {
            position: fixed;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 8s infinite ease-in;
            z-index: 1;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        /* Khung chính nhập tên */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border: 4px solid #ff7675;
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 118, 117, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .cute-decor {
            font-size: 2.3rem;
            margin-bottom: 8px;
            letter-spacing: 6px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1.main-title {
            color: #d63031;
            margin-bottom: 8px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(255, 182, 193, 0.8);
        }

        p.subtitle {
            color: #636e72;
            margin-bottom: 22px;
            font-size: 0.98rem;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            border: 2px solid #ff7675;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            background-color: #fff5f5;
            color: #2d3436;
        }

        input[type="text"]:focus {
            border-color: #d63031;
            box-shadow: 0 0 15px rgba(214, 48, 49, 0.4);
            background-color: #ffffff;
        }

        button.btn-submit {
            background: linear-gradient(135deg, #ff7675, #d63031);
            color: white;
            border: none;
            padding: 16px 25px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.4);
            width: 100%;
        }

        button.btn-submit:hover {
            transform: translateY(-2px);
        }

        .error-message {
            color: #d63031;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* MODAL HIỂN THỊ PHONG BÌ BỰ GIỮA MÀN HÌNH */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Khung Phong Bì & Gấu */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            perspective: 1000px;
            margin-top: 60px;
        }

        /* Chú gấu nhô lên từ phía sau phong bì */
        .bear-helper {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 75px;
            z-index: 1;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
            user-select: none;
        }

        /* Phong bì chính */
        .envelope {
            width: 100%;
            height: 100%;
            background: #ff7675;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        /* Nắp phong bì */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 115px solid #d63031;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 4;
        }

        /* Mặt trước phong bì */
        .envelope-front {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid #fab1a0;
            border-right: 160px solid #fab1a0;
            border-bottom: 110px solid #ff7675;
            border-radius: 0 0 18px 18px;
            z-index: 3;
        }

        /* Tờ Thư Chui Ra */
        .letter-paper {
            position: absolute;
            bottom: 10px;
            left: 15px;
            width: 290px;
            height: 190px;
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            z-index: 2;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow-y: auto;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #2d3436;
            white-space: pre-line;
        }

        /* HƯỚNG DẪN BẤM */
        .click-hint {
            position: absolute;
            bottom: -50px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 1.05rem;
            animation: flash 1.5s infinite;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* KHI BẤM MỞ THƯ: Gấu nhô cao hơn + Nắp mở + Thư rút ra */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-wrapper.open .bear-helper {
            top: -110px;
            transform: translateX(-50%) scale(1.15);
        }

        .envelope-wrapper.open .letter-paper {
            transform: translateY(-160px) scale(1.15);
            height: 320px;
            z-index: 5;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .envelope-wrapper.open .click-hint {
            display: none;
        }

        /* Nút đóng */
        .btn-close-modal {
            position: absolute;
            top: -110px;
            right: -10px;
            background: #ffffff;
            color: #d63031;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- KHUNG NHẬP TÊN -->
    <div class="card-container">
        <div class="cute-decor">🧸 🌸 💖 🌺</div>
        <h1 class="main-title">✨ CHÚC MỪNG 20/10 ✨</h1>
        <p class="subtitle">Nhập chính xác tên của ní để nhận phần quà bí mật từ Duy nhé!</p>

        <div class="input-group">
            <input type="text" id="userNameInput" placeholder="Nhập tên của ní vào đây nè..." autocomplete="off">
            <button class="btn-submit" type="button" onclick="checkNameAndOpen()">Nhận Quà Phụ Nữ Việt Nam 🎁</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- LÁ THƯ BỰ & CHÚ GẤU MỞ THƯ -->
    <div class="modal-overlay" id="letterModal">
        <div class="envelope-wrapper" id="envelopeWrapper" onclick="toggleEnvelope()">
            <button class="btn-close-modal" type="button" onclick="closeLetterModal(event)">✕</button>

            <!-- Chú gấu bông -->
            <div class="bear-helper">🧸</div>

            <!-- Phong Bì -->
            <div class="envelope">
                <div class="envelope-flap"></div>
                <div class="letter-paper" id="letterContent"></div>
                <div class="envelope-front"></div>
            </div>

            <div class="click-hint">👇 Chạm vào phong bì để chú Gấu mở thư nha!</div>
        </div>
    </div>

    <script>
        // Hiệu ứng bong bóng & icon bay
        const icons = ['🧸', '🌸', '💖', '🌺', '🎀', '✨', '🌷', '💐', '🎁'];
        function createFallingElements() {
            setInterval(() => {
                const element = document.createElement('div');
                element.classList.add('falling-element');
                element.innerText = icons[Math.floor(Math.random() * icons.length)];
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDuration = (Math.random() * 3 + 4) + 's';
                element.style.fontSize = (Math.random() * 12 + 20) + 'px';
                document.body.appendChild(element);

                setTimeout(() => { element.remove(); }, 7000);
            }, 300);
        }

        function createBubbles() {
            for (let i = 0; i < 12; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 40 + 20 + 'px';
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + 'vw';
                bubble.style.animationDuration = (Math.random() * 5 + 6) + 's';
                bubble.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(bubble);
            }
        }

        createFallingElements();
        createBubbles();

        // Danh sách 4 lá thư
        const messagesData = {
            "mai": `Chào Phạm Thị Ngọc Mai,\n\nDạo này việc học đại học sao rồi Mai, lịch học với thi cử bớt dồn dập chưa? Bữa giờ lu bu quá tính ra tụi mình từ hồi tốt nghiệp cấp ba tới giờ cũng lâu lắm rồi chưa có dịp ngồi lại mần ly cà phê tám chuyện.\n\nNhân ngày 20/10, Sơn Khánh Duy chúc Mai lúc nào cũng tươi tắn, học hành qua môn dễ dàng, điểm số cao chót vót và săn được nhiều học bổng nha. Dù đứa nào cũng bận rộn với môi trường mới nhưng Duy lúc nào cũng nhớ tới tình bạn thời cấp ba của tụi mình. Hôm nào rảnh rỗi thu xếp được thì nhắn Duy cái, tụi mình đi cà phê gầy sòng nói chuyện tiếp.\n\nChúc Mai có một ngày 20/10 thiệt là vui vẻ!\n\nSơn Khánh Duy`,

            "ngoc": `Em chào chị Trịnh Thị Bảo Ngọc,\n\nLâu quá không gặp, dạo này chị khỏe hông? Đi làm đợt này công việc bớt lu bu chưa hay vẫn chạy deadline muốn xỉu vậy chị?\n\nNhân dịp 20/10, em chúc chị Ngọc ngày càng trẻ trung, xinh đẹp, công việc phơi phới, lương thưởng ngon lành và tiền vô tài khoản ào ào nha. Chúc cho mấy dự định sắp tới trong công việc của chị cái nào cũng thành công rực rỡ. Hôm nay chị nhớ tự thưởng cho mình bữa ăn thiệt ngon hoặc đi chill thư giãn nhé. Cuối tuần nào rảnh rỗi chị em mình gầy kèo gặp nhau một chuyến.\n\nSơn Khánh Duy`,

            "my": `Chào La Đặng Thảo My,\n\nNgoảnh đi ngoảnh lại mà lâu lắm rồi không gặp lại My. Dạo này đi làm công việc thế nào rồi, có bị tăng ca nhiều hông? Hôm nay tới 20/10 nên Duy nhắn tin hỏi thăm coi dạo này sống sao rồi.\n\nChúc Thảo My ngày 20/10 thiệt là nhiều niềm vui, công việc suôn sẻ, sếp thương đồng nghiệp quý và gặp toàn may mắn. Mong My luôn vững vàng, sự nghiệp thăng tiến và mần ăn trúng lớn nha. Dù bận rộn tới đâu cũng nhớ giữ gìn sức khỏe. Khi nào thong thả nhắn Duy, tụi mình lại đi cà phê như hồi trước.\n\nSơn Khánh Duy`,

            "ly": `Chào Thạch Như Lý,\n\nDạo này việc học trên trường đại học với mấy kế hoạch mới tới đâu rồi Lý? Tuy dạo này ít gặp nhưng Duy vẫn thỉnh thoảng thấy Lý đăng hình đi học, chạy bài tập bận rộn suốt.\n\nNgày 20/10, Duy chúc Như Lý lúc nào cũng năng động, tươi rói, học hành ngon lành và gặt hái được nhiều thành tích tốt trên trường. Chúc cho mấy mục tiêu Lý đang theo đuổi sớm thu về kết quả ngon lành như mong đợi. Hy vọng sớm có dịp tụ tập lại để ngồi trò chuyện nhiều hơn. Tận hưởng một ngày 20/10 thiệt trọn vẹn nha!\n\nSơn Khánh Duy`
        };

        function removeVietnameseTones(str) {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            return str.toLowerCase().trim();
        }

        // Kiểm tra tên và mở Modal chứa Phong Bì Bự
        function checkNameAndOpen() {
            const inputVal = document.getElementById('userNameInput').value;
            const cleanInput = removeVietnameseTones(inputVal);
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.style.display = 'none';

            if (!cleanInput) {
                errorDiv.innerText = "⚠️ Ní ơi, nhập tên vào ô trước rồi mới ấn nhận quà được nha!";
                errorDiv.style.display = 'block';
                return;
            }

            let foundKey = null;
            if (cleanInput.includes("mai")) foundKey = "mai";
            else if (cleanInput.includes("ngoc")) foundKey = "ngoc";
            else if (cleanInput.includes("my")) foundKey = "my";
            else if (cleanInput.includes("ly")) foundKey = "ly";

            if (foundKey) {
                document.getElementById('letterContent').innerText = messagesData[foundKey];
                document.getElementById('letterModal').style.display = 'flex';
            } else {
                errorDiv.innerText = "⚠️ Tên này hông có trong danh sách nhận quà của Duy rồi! Ní kiểm tra lại xem gõ đúng tên Mai, Ngọc, My hay Lý chưa nha.";
                errorDiv.style.display = 'block';
            }
        }

        function closeLetterModal(e) {
            e.stopPropagation();
            document.getElementById('letterModal').style.display = 'none';
            document.getElementById('envelopeWrapper').classList.remove('open');
        }

        // Bấm vào phong bì để mở thư & bắn pháo hoa
        function toggleEnvelope() {
            const wrapper = document.getElementById('envelopeWrapper');
            wrapper.classList.toggle('open');

            if (wrapper.classList.contains('open') && typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 100,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#ff7675', '#d63031', '#fecfef', '#ffffff']
                });
            }
        }

        document.getElementById('userNameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkNameAndOpen();
            }
        });
    </script>
</body>
</html>
